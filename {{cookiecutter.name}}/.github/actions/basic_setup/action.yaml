name: BasicSetup
description: basic setup
inputs:
  python_version:
    description: 'Python version'
    type: string
    required: false
    default: '3.13'


runs:
  using: composite
  steps:
    - name: Set up uv and Python ${{inputs.python_version}}
      uses: astral-sh/setup-uv@v10.4.0
      with:
        python-version: ${{inputs.python_version}}
        enable-cache: true
    - name: Install Project
      run: uv sync --locked
      shell: bash
